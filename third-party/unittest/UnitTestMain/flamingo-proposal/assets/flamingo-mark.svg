<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" width="260" height="340" role="img" aria-label="$FLAMINGO mascot mark">
  <defs>
    <linearGradient id="flg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9fd0"/><stop offset="1" stop-color="#ff2e93"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset=".5" stop-color="#7b2ff7"/><stop offset="1" stop-color="#ff2e93"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="fl">
      <path d="M70 90 C90 82 72 58 82 42 C88 32 80 24 70 26" fill="none" stroke="url(#flg)" stroke-width="7" stroke-linecap="round"/>
      <path d="M50 112 L48 152 M43 152 L54 152" stroke="#ff4fa0" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M60 112 L64 132 L53 139" stroke="#ff4fa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <ellipse cx="46" cy="96" rx="32" ry="19" fill="url(#flg)" transform="rotate(-8 46 96)"/>
      <path d="M22 92 Q42 78 70 92 Q50 112 22 92Z" fill="#d81b7a" opacity=".85"/>
      <path d="M16 94 Q3 98 5 113 Q18 109 25 100Z" fill="#ff5fae"/>
      <circle cx="68" cy="26" r="7.5" fill="url(#flg)"/>
      <path d="M62 22 Q50 22 47 32 Q55 29 63 30Z" fill="#ffc2e0"/>
      <path d="M47 32 Q49 27 53 25 Q51 30 47 32Z" fill="#1a0838"/>
      <circle cx="70" cy="24" r="1.8" fill="#0d0221"/>
    </g>
  </defs>
  <circle cx="130" cy="150" r="118" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="4 10" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" values="0 130 150;360 130 150" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="150" r="96" fill="#1a0838" opacity=".85"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".4 0 .6 1;.4 0 .6 1"/>
    <g transform="translate(66 62) scale(1.35)" filter="url(#glow)"><use href="#fl"/></g>
  </g>
  <ellipse cx="130" cy="296" rx="62" ry="8" fill="#ff2e93" opacity=".35"><animate attributeName="rx" values="62;50;62" dur="3.4s" repeatCount="indefinite"/></ellipse>
  <text x="130" y="326" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-weight="900" font-size="26" letter-spacing="3" fill="url(#flg)" filter="url(#glow)">$FLAMINGO</text>
  <g fill="#fff">
    <path d="M40 60 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2z"><animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/></path>
    <path d="M222 100 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2z"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="-1.3s" repeatCount="indefinite"/></path>
  </g>
</svg>
