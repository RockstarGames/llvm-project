      <line x1="0" y1="300" x2="1200" y2="300"><animateTransform attributeName="transform" type="translate" values="0 0;0 120" keyTimes="0;1" dur="3s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keySplines=".6 0 1 1"/></line>
      <line x1="0" y1="300" x2="1200" y2="300"><animateTransform attributeName="transform" type="translate" values="0 0;0 120" keyTimes="0;1" dur="3s" begin="-1s" repeatCount="indefinite" calcMode="spline" keySplines=".6 0 1 1"/></line>
      <line x1="0" y1="300" x2="1200" y2="300"><animateTransform attributeName="transform" type="translate" values="0 0;0 120" keyTimes="0;1" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keySplines=".6 0 1 1"/></line>
      <line x1="0" y1="300" x2="1200" y2="300"><animateTransform attributeName="transform" type="translate" values="0 0;0 120" keyTimes="0;1" dur="3s" begin="-2s" repeatCount="indefinite" calcMode="spline" keySplines=".6 0 1 1"/></line>
      <line x1="0" y1="300" x2="1200" y2="300"><animateTransform attributeName="transform" type="translate" values="0 0;0 120" keyTimes="0;1" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keySplines=".6 0 1 1"/></line>
    </g>
  </g>
  <rect x="0" y="298" width="1200" height="3" fill="#ff9a1f" filter="url(#soft)"/>

  <g fill="none" stroke="#08011a" stroke-linecap="round">
