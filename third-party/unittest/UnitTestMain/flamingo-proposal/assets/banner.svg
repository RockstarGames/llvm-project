    <rect x="278" y="248" width="26" height="52"/><rect x="326" y="215" width="26" height="85"/><rect x="356" y="245" width="30" height="55"/>
    <rect x="814" y="240" width="30" height="60"/><rect x="848" y="220" width="28" height="80"/>
    <rect x="900" y="245" width="36" height="55"/><rect x="942" y="225" width="30" height="75"/>
    <rect x="978" y="255" width="34" height="45"/><rect x="1018" y="238" width="38" height="62"/>
    <rect x="1062" y="262" width="28" height="38"/><rect x="1096" y="232" width="36" height="68"/><rect x="1138" y="250" width="40" height="50"/>
  </g>
  <g fill="#00e5ff">
