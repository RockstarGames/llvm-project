      <path d="M0 0 C14 -90 -8 -170 26 -250" stroke-width="9"/>
      <path d="M26 -250 Q70 -290 120 -250 M26 -250 Q60 -320 130 -310 M26 -250 Q-10 -300 -70 -270 M26 -250 Q-20 -330 -80 -330 M26 -250 Q90 -250 140 -200 M26 -250 Q-30 -240 -80 -190" stroke-width="6"/>
    </g>
    <g transform="translate(1080 420) scale(-1 1)">
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="1 0 0;-1.6 0 0;1 0 0" dur="7s" repeatCount="indefinite"/>
      <path d="M0 0 C14 -90 -8 -170 26 -250" stroke-width="9"/>
      <path d="M26 -250 Q70 -290 120 -250 M26 -250 Q60 -320 130 -310 M26 -250 Q-10 -300 -70 -270 M26 -250 Q-20 -330 -80 -330 M26 -250 Q90 -250 140 -200 M26 -250 Q-30 -240 -80 -190" stroke-width="6"/>
    </g>
  </g>

  <g transform="translate(205 262) scale(1.05)" filter="url(#glowS)">
