    <line x1="600" y1="300" x2="320" y2="420"/><line x1="600" y1="300" x2="450" y2="420"/><line x1="600" y1="300" x2="580" y2="420"/><line x1="600" y1="300" x2="620" y2="420"/>
    <line x1="600" y1="300" x2="750" y2="420"/><line x1="600" y1="300" x2="880" y2="420"/><line x1="600" y1="300" x2="1010" y2="420"/><line x1="600" y1="300" x2="1140" y2="420"/>
    <line x1="600" y1="300" x2="1270" y2="420"/><line x1="600" y1="300" x2="1400" y2="420"/>
