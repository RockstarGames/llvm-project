      <rect x="480" y="240" width="240" height="2" fill="#000"><animate attributeName="height" values="2;6;2" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="480" y="258" width="240" height="4" fill="#000"><animate attributeName="height" values="4;9;4" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="480" y="275" width="240" height="6" fill="#000"><animate attributeName="height" values="6;12;6" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="480" y="291" width="240" height="8" fill="#000"><animate attributeName="height" values="8;14;8" dur="4s" repeatCount="indefinite"/></rect>
