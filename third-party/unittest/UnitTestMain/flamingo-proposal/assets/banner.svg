  <g transform="translate(600 238) skewX(-8)" font-family="Impact,'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="112" text-anchor="middle" letter-spacing="2">
    <text x="0" y="0" fill="#ff2e93" filter="url(#glow)" opacity=".9">$FLAMINGO</text>
    <text x="0" y="0" fill="#00e5ff" opacity=".8"><animate attributeName="x" values="0;0;-6;5;0;0" keyTimes="0;.88;.9;.93;.95;1" dur="5s" repeatCount="indefinite"/>$FLAMINGO</text>
    <text x="0" y="0" fill="#ff2e93" opacity=".8"><animate attributeName="x" values="0;0;6;-5;0;0" keyTimes="0;.88;.9;.93;.95;1" dur="5s" repeatCount="indefinite"/>$FLAMINGO</text>
    <text x="0" y="0" fill="#0b0220" stroke="#0b0220" stroke-width="12" stroke-linejoin="round">$FLAMINGO</text>
    <text x="0" y="0" fill="url(#chrome)" stroke="#00e5ff" stroke-width="2">$FLAMINGO</text>
  </g>
  <g clip-path="url(#titleclip)">
    <rect x="0" y="110" width="90" height="160" fill="url(#shine)" transform="skewX(-20)" opacity=".7">
      <animate attributeName="x" values="150;1000" keyTimes="0;1" dur="5s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Consolas,'Courier New',monospace" text-anchor="middle">
    <text x="600" y="345" font-size="22" font-weight="700" letter-spacing="10" fill="#00e5ff" filter="url(#glowS)">CRYPTO ECONOMY // LEONIDA</text>
    <text x="600" y="380" font-size="14" letter-spacing="6" fill="#ff9a1f">WALLET  /  EXCHANGE  /  BLACK MARKET  /  HEISTS</text>
  </g>
  <text x="1172" y="34" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="12" letter-spacing="3" fill="#ffffff" opacity=".75">v0.2 DRAFT<animate attributeName="opacity" values=".75;.25;.75" dur="2s" repeatCount="indefinite"/></text>

  <rect width="1200" height="420" fill="url(#scan)"><animateTransform attributeName="transform" type="translate" values="0 0;0 4" dur=".5s" repeatCount="indefinite"/></rect>
  <rect width="1200" height="420" fill="url(#vig)"/>
</svg>
