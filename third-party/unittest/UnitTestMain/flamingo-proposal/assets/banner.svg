    <rect x="336" y="228" width="4" height="5"><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="858" y="234" width="4" height="5"><animate attributeName="opacity" values="1;0;1" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="952" y="240" width="4" height="5"><animate attributeName="opacity" values="0;1;0" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="1106" y="246" width="4" height="5"><animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/></rect>
  </g>
