      <text x="80" y="125" font-size="12" font-weight="700" fill="#fff">SUNSET</text><text x="80" y="140" font-size="11" fill="#9d8ab8">#FF9A1F</text></g>
    <g transform="translate(692 10)"><rect width="160" height="100" rx="14" fill="#ffe14d" filter="url(#g)"><animate attributeName="opacity" values="1;.75;1" dur="3s" begin="-1.2s" repeatCount="indefinite"/></rect><rect width="160" height="100" rx="14" fill="url(#sheen)"/>
