  </g>
  <path d="M283 150h74m245 0h74" stroke="#aeb0d2" stroke-width="3" stroke-dasharray="7 8"/>
  <text x="480" y="270" fill="#e9c987" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">AudaCity is the brand behind Dacity Coin in the game world.</text>
